# Prueba el instalador de un clic en un Windows limpio, como lo correria el usuario.
name: Instalador Windows
on:
  push:
    paths: ["instalar/**", "pyproject.toml", "estudio/**", ".github/workflows/instalador-windows.yml"]
  workflow_dispatch:

jobs:
  instalar:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Correr el .bat solo (baja el script de GitHub, como el usuario)
        shell: cmd
        run: |
          mkdir "%TEMP%\solo"
          copy "instalar\Instalar Xandart.bat" "%TEMP%\solo\"
          echo.| call "%TEMP%\solo\Instalar Xandart.bat"

      - name: Revisar lo instalado
        shell: powershell
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'Xandart'
          foreach ($f in "$d\.venv\Scripts\pythonw.exe", "$d\herramientas\uv.exe", "$d\estudio\app.py",
                         "$([Environment]::GetFolderPath('Desktop'))\Xandart.lnk",
                         "$([Environment]::GetFolderPath('Programs'))\Xandart\Actualizar Xandart.lnk") {
            if (-not (Test-Path $f)) { throw "Falta $f" } else { "ok $f" }
          }
          if (Test-Path "$d\cache") { throw 'quedo la cache' }
          $ok = $false
          foreach ($i in 1..30) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8030/api/estado; $ok = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $ok) { Get-Content "$d\logs\xandart.log" -ErrorAction SilentlyContinue; throw 'La pagina no abrio' }
          $r | ConvertTo-Json -Depth 4
          if (-not $r.claude) { Write-Host 'AVISO: Claude no quedo instalado' }
          Invoke-WebRequest http://127.0.0.1:8030/ -UseBasicParsing | Select-Object StatusCode

      - name: Pruebas de Xandart en Windows
        shell: powershell
        timeout-minutes: 15
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'Xandart'
          & "$d\herramientas\uv.exe" pip install --python "$d\.venv\Scripts\python.exe" pytest httpx pytest-timeout
          Set-Location $d
          & "$d\.venv\Scripts\python.exe" -m pytest -v --timeout=180 --durations=10
          if ($LASTEXITCODE -ne 0) { throw 'fallaron pruebas' }

      - name: Actualizar con Xandart abierto (cierra el viejo y no borra claves)
        shell: powershell
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'Xandart'
          Set-Content "$d\.env" 'TOGETHER_API_KEY=prueba' -Encoding ascii
          $antes = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*estudio.app*' } | ForEach-Object { $_.ProcessId })
          "Xandart abierto antes de actualizar: $($antes -join ', ')"
          if (-not $antes) { throw 'la prueba necesita a Xandart abierto' }
          cmd /c 'echo.| call "instalar\Instalar Xandart.bat"'
          $vivos = @(Get-Process -Id $antes -ErrorAction SilentlyContinue)
          if ($vivos) { throw "el Xandart viejo sigue abierto: $($vivos.Id -join ', ')" }
          if (-not (Select-String -Path "$d\.env" -Pattern 'TOGETHER_API_KEY=prueba' -Quiet)) { throw 'se borraron las claves' }
          Start-Sleep 5
          (Invoke-RestMethod http://127.0.0.1:8030/api/version).version

      - name: Xandart Nueva al lado (copia de seguridad, videos de siempre, la de siempre intacta)
        shell: powershell
        timeout-minutes: 20
        run: |
          $vieja = Join-Path $env:LOCALAPPDATA 'Xandart'
          # un video de la de siempre, para ver que la nueva lo muestra y que lo copia antes de migrar
          $p = Join-Path $vieja 'proyectos\peces'
          New-Item -ItemType Directory -Force "$p\imagenes" | Out-Null
          Set-Content "$p\proyecto.json" '{"slug":"peces","titulo":"Peces del Amazonas","canal":"animales-peligrosos","estilo":"enciclopedia_mascota","duracion_objetivo_seg":540,"creado":"2026-09-28T00:00:00+00:00"}' -Encoding ascii
          Set-Content "$p\imagenes\escena_001.png" 'imagen' -Encoding ascii
          $antesVieja = (Get-ChildItem $vieja -Recurse -File | Where-Object { $_.FullName -notmatch '\\(__pycache__|logs)\\' } | Measure-Object).Count
          $pidVieja = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*estudio.app*' } | ForEach-Object { $_.ProcessId })
          # igual que el .bat: el instalador se corre como BLOQUE (asi se corre cuando se baja de GitHub).
          # Correrlo con -File escondio un error de alcance que dejaba el .env vacio.
          & powershell -NoProfile -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create([IO.File]::ReadAllText('$((Resolve-Path 'instalar\instalar-nueva.ps1').Path)')))"
          if ($LASTEXITCODE -ne 0) { throw 'fallo el instalador de la nueva' }
          $envNueva = Join-Path $env:LOCALAPPDATA 'XandartNueva\.env'
          Get-Content $envNueva | Where-Object { $_ -notmatch '_KEY=' }
          if (-not (Select-String -Path $envNueva -Pattern '^ESTUDIO_PROYECTOS=' -Quiet)) { throw 'el .env de la nueva quedo sin configurar' }
          $nueva = Join-Path $env:LOCALAPPDATA 'XandartNueva'
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Xandart Nueva.lnk")) { throw 'falta el acceso directo' }
          if (@(Get-Process -Id $pidVieja -ErrorAction SilentlyContinue).Count -ne $pidVieja.Count) { throw 'la nueva cerro la Xandart de siempre' }
          $ok = $false
          foreach ($i in 1..90) {
            try { $e = Invoke-RestMethod http://127.0.0.1:8031/api/v2/estado-local; if ($e.fase -in 'listo', 'error') { $ok = $true; break } } catch { }
            Start-Sleep 2
          }
          $e | ConvertTo-Json
          if (-not $ok -or $e.fase -ne 'listo') { Get-Content "$nueva\logs\xandart.log" -ErrorAction SilentlyContinue; throw "no quedo lista: $($e.error)" }
          $copias = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Xandart copias'
          $copia = Get-ChildItem $copias -Directory | Select-Object -First 1
          if (-not (Test-Path "$($copia.FullName)\proyectos\peces\imagenes\escena_001.png")) { throw 'la copia no tiene el video' }
          $videos = Invoke-RestMethod http://127.0.0.1:8031/api/v2/videos
          if (-not ($videos | Where-Object { $_.slug -eq 'peces' })) { throw 'la nueva no muestra el video de siempre' }
          $canales = Invoke-RestMethod http://127.0.0.1:8031/api/v2/canales
          $canales | ConvertTo-Json -Depth 3
          if (-not $canales) { throw 'no se registro el canal' }
          if ((Invoke-WebRequest http://127.0.0.1:8031/app/ -UseBasicParsing).Content -notlike '*id="raiz"*') { throw 'no abre /app' }
          $despuesVieja = (Get-ChildItem $vieja -Recurse -File | Where-Object { $_.FullName -notmatch '\\(__pycache__|logs)\\' } | Measure-Object).Count
          if ($despuesVieja -ne $antesVieja) { throw "la nueva escribio en la carpeta de siempre ($antesVieja -> $despuesVieja archivos)" }
          (Invoke-RestMethod http://127.0.0.1:8030/api/version).version
