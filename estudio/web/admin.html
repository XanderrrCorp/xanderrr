<!doctype html>

<title>Xandart · Administración</title>
<link rel="icon" type="image/svg+xml" href="/web/xandart.svg">
<link rel="stylesheet" href="/web/xandart.css">
<style>
  .tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabla th, .tabla td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.08); vertical-align: middle; }
  .tabla th { font-weight: 600; opacity: .75; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tabla input { padding: 4px 6px; width: 7em; margin: 0; }
  .tabla input.largo { width: 14em; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .cifra b { display: block; font-size: 22px; }
  .desliza { overflow-x: auto; }
  .bajo { color: #ff8a8a; font-weight: 600; }
</style>
</head>
