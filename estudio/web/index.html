<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<title>Xandart</title>
<link rel="icon" type="image/svg+xml" href="/web/xandart.svg">
<link rel="stylesheet" href="/web/xandart.css">
</head>
<body>
<header class="cab">
  <a class="marca" href="#" onclick="irInicio();return false">
    <img src="/web/xandart.svg" alt="" width="32" height="32"><span>Xandart</span>
  </a>
  <span class="crece"></span>
  <button class="fantasma" onclick="irBiblioteca()" title="Música y efectos de sonido con licencia">♪ Sonidos</button>
  <a href="/app/"><button class="primario" title="La interfaz nueva de Xandart (en pruebas)">✦ Nueva Xandart</button></a>
  <a href="/admin"><button class="fantasma" title="Precios, márgenes y saldos de proveedores">Administración</button></a>
  <button class="fantasma" onclick="abrirAjustes()" title="Claves y cuenta de Claude">⚙ Ajustes</button>
</header>

<main id="app"><p class="tenue">cargando…</p></main>

<dialog id="ajustes">
  <h2>Ajustes</h2>
  <p class="tenue">Las claves se guardan solo en este computador.</p>
  <label>Clave de Together (solo para «Animar» en el editor; las imágenes van con Google)
    <input id="k-together" type="password" placeholder="tgp_v1_…" autocomplete="off">
  </label>
  <div class="fila"><span id="e-together" class="estado"></span><button class="mini" onclick="probar('together')">Probar</button></div>
  <label>Clave de MiniMax (voz)
    <input id="k-minimax" type="password" placeholder="pega tu clave" autocomplete="off">
  </label>
  <div class="fila"><span id="e-minimax" class="estado"></span><button class="mini" onclick="probar('minimax')">Probar</button></div>
  <label>Clave de Pexels (fotos y videos reales, gratis)
    <input id="k-pexels" type="password" placeholder="pega tu clave de pexels.com/api" autocomplete="off">
  </label>
  <div class="fila"><span id="e-pexels" class="estado"></span><button class="mini" onclick="probar('pexels')">Probar</button></div>
  <label>Clave de Freesound (efectos de sonido CC0, gratis)
    <input id="k-freesound" type="password" placeholder="pega tu clave de freesound.org" autocomplete="off">
  </label>
  <div class="fila"><span id="e-freesound" class="estado"></span><button class="mini" onclick="probar('freesound')">Probar</button></div>
  <label>Clave de Google AI Studio (imágenes directo con Google, opcional)
    <input id="k-gemini" type="password" placeholder="pega tu clave de aistudio.google.com/apikey" autocomplete="off">
  </label>
  <div class="fila"><span id="e-gemini" class="estado"></span><button class="mini" onclick="probar('gemini')">Probar</button></div>
  <label>Las imágenes se hacen con
    <select id="proveedor-img" onchange="elegirProveedorImagenes(this.value)">
      <option value="vertex">Google Cloud · Agent Platform (créditos de Google)</option>
      <option value="gemini">Google AI Studio</option>
    </select>
  </label>
  <label>Conexión completa con Google Cloud (más cupo de imágenes; usa tus créditos)</label>
  <div class="fila"><span id="e-gcuenta" class="estado"></span>
    <input id="f-gcuenta" type="file" accept=".json,application/json" style="display:none" onchange="subirCuentaGoogle(this)">
    <button class="mini" onclick="document.getElementById('f-gcuenta').click()">Subir archivo .json</button>
    <button class="mini" id="b-gcuenta-quitar" onclick="quitarCuentaGoogle()" style="display:none">Quitar</button></div>
  <label><input id="c-lotes" type="checkbox" onchange="elegirLotes(this.checked)">
    Imágenes por lotes: mitad de precio y sin el límite por minuto, pero Google las entrega cuando puede (minutos u horas)</label>
  <label>Claude (escribe el guion con tu suscripción)</label>
  <div class="fila"><span id="e-claude" class="estado"></span>
    <button class="mini" onclick="sesionClaude()">Iniciar sesión</button>
    <button class="mini" onclick="probar('claude')">Probar</button></div>
  <div class="fila fin">
    <button class="fantasma" onclick="document.getElementById('ajustes').close()">Cerrar</button>
    <button class="primario" onclick="guardarClaves()">Guardar</button>
  </div>
</dialog>

<script src="/web/xandart.js"></script>
<script src="/web/miniaturas.js"></script>
</body>
</html>
