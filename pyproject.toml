[project]
name = "estudio"
version = "0.1.0"
description = "Estudio de producción de video para Buscanichos"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
estudio = "estudio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["estudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
