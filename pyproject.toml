[project]
name = "estudio"
version = "0.1.0"
description = "Estudio de producción de video para Buscanichos"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pillow>=10", "requests>=2.31", "numpy>=1.24", "imageio-ffmpeg>=0.5",
                "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
                "sqlalchemy>=2.0", "alembic>=1.13",
                "opencv-python-headless>=4.8"]   # zoom y escalado de cada cuadro del render, rápido

# rembg (quitar fondos de las miniaturas) es opcional y pesado: el instalador lo intenta
# aparte y, si no está, se usa el recorte por color de fondo

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
recorte = ["rembg[cpu]>=2.0.50"]
tracy = ["faster-whisper>=1.0"]       # modo Tracy: tiempos reales por oración con Whisper local

[project.scripts]
estudio = "estudio.cli:main"
xandart = "estudio.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["estudio*"]

[tool.setuptools.package-data]
estudio = ["web/*", "web_app/*", "web_app/assets/*", "fuentes/*", "plataforma/migraciones/*", "plataforma/migraciones/versions/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
